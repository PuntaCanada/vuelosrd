name: Public website smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Cloudflare Pages availability and main features
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vuelosrd.pages.dev/"
          echo "Checking $URL"
          # Cloudflare Pages may briefly serve the previous deployment after a push.
          for attempt in $(seq 1 12); do
            curl --fail --location --silent --show-error --retry 2 --retry-delay 2 --max-time 15 "$URL" -o /tmp/site.html
            if python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          s=Path('/tmp/site.html').read_text(encoding='utf-8')
          assert 'VuelosRD' in s, 'Wrong site content'
          assert 'Punta Cana' in s, 'Airport selector missing'
          assert 'Deutsch' in s, 'Language menu missing'
          assert s.count('class="flag-icon"') == 5, 'DEPLOYMENT STALE: SVG flag fix not on public website'
          assert 'id="langMenu"' in s, 'DEPLOYMENT STALE: new language menu not published'
          assert 'id="goAirports"' in s, 'DEPLOYMENT STALE: top navigation not published'
          assert 'id="flight-board"' in s, 'DEPLOYMENT STALE: airport board not published'
          assert 'id="boardArrivals"' in s and 'id="boardDepartures"' in s, 'Airport board toggles absent'
          assert 'id="boardRows"' in s and 'function renderBoard()' in s, 'Airport board script absent'
          assert 'id="shareBoard"' in s and 'function boardUrl()' in s, 'DEPLOYMENT STALE: shareable board missing'
          assert 'id="flight-status"' in s and 'function renderFlightStatus()' in s, 'DEPLOYMENT STALE: flight status panel missing'
          assert s.index('id="flight-board"') < s.index('id="flightTitle"'), 'DEPLOYMENT STALE: board not at top'
          assert 'Airport-terminal visual system' in s and 'margin-top:-83px' in s, 'DEPLOYMENT STALE: new header / board design missing'
          assert 'Compact airport display for narrow screens' in s and 'td.dataset.label=' in s, 'DEPLOYMENT STALE: mobile card layout missing'
          assert 'id="detail-board-link"' in s and 'const airportDetailWords=' in s, 'DEPLOYMENT STALE: airport detail improvements missing'
          assert 'const airportArea=' in s and 'airport-card-visual' in s, 'DEPLOYMENT STALE: destination cards missing'
          assert 'Mobile and visual polish' in s and 'class="skip-link"' in s, 'DEPLOYMENT STALE: mobile accessibility polish missing'
          assert 'id="boardLiveLink"' in s and 'const realSourceText=' in s, 'DEPLOYMENT STALE: real flight source links absent'
          assert 'id="flightSearchPreview"' in s and 'const flightSearchMessages=' in s, 'DEPLOYMENT STALE: guided flight search missing'
          assert 'id="airlines"' in s and 'const airlineDirectory=' in s, 'DEPLOYMENT STALE: official airline directory missing'
          assert 'id="airlineFilter"' in s and 'function updateAirlineSuggestion()' in s, 'DEPLOYMENT STALE: airline search integration missing'
          assert 'function isFlightNumber(value)' in s and 'airline-start-search' in s, 'DEPLOYMENT STALE: flight format/airline quick-search missing'
          assert s.count("logo:'https://commons.wikimedia.org/wiki/Special:FilePath/") == 26, 'DEPLOYMENT STALE: expected 26 airline image sources'
          assert 'id="flightAirlineQuickFilter"' in s and 'function prepareAirlineFlight(code)' in s, 'DEPLOYMENT STALE: new airline search UI is missing'
          assert 'id="travel-assist"' in s and 'id="travelAssistAirport"' in s and 'function renderTravelAssist()' in s, 'DEPLOYMENT STALE: new practical travel guide missing'
          assert 'id="airport-deep-guide"' in s and 'function renderAirportDeepGuide(code)' in s, 'DEPLOYMENT STALE: service and accessibility detail cards missing'
          assert 'id="airport-compare"' in s and 'id="compareSearch"' in s and 'id="compareFilter"' in s, 'DEPLOYMENT STALE: airport comparison missing'
          assert 'id="airport-orientation"' in s and 'function airportGuidePath(code)' in s, 'DEPLOYMENT STALE: orientation and airport guide routes missing'
          assert 'id="passenger-hub"' in s and 'id="passenger-checklist"' in s, 'DEPLOYMENT STALE: traveler checklists missing'
          assert 'id="journey-wizard"' in s and 'id="journeyAirport"' in s and 'id="journeyStage"' in s, 'DEPLOYMENT STALE: integrated journey assistant missing'
          assert 'function renderJourneyAssistant()' in s and 'id="journey-airline-source"' in s, 'DEPLOYMENT STALE: linked official airline journey source missing'
          assert 'id="mobileGoJourney"' in s and 'id="journey-flight-link"' in s, 'DEPLOYMENT STALE: mobile trip/flight shortcuts missing'
          assert "inactiveAirlineWords=" in s and "spiritrestructuring.com" in s, 'DEPLOYMENT STALE: verified ceased-Spirit airline status missing'
          assert 'id="flightFocusAirline"' in s and 'id="flightFocusJourney"' in s and 'const flightQuickNavWords=' in s, 'DEPLOYMENT STALE: localized flight search shortcuts missing'
          assert "journey:'Meine Reise'" in s and 'function prepareAirlineFlight(code)' in s, 'DEPLOYMENT STALE: five-language journey navigation missing'
          assert 'function renderPassengerIssue()' in s and 'const passengerSources=' in s, 'DEPLOYMENT STALE: official baggage source routing missing'
          assert 'romanaairport.com/lost-and-found/' in s and 'puntacanainternationalairport.com/en/airport-services/item/lost-found' in s, 'DEPLOYMENT STALE: official airport lost and found links missing'
          assert 'id="goCompare"' in s and 'function renderAirportCompare()' in s, 'DEPLOYMENT STALE: comparison navigation missing'
          assert 'wheelchair-service' in s and 'romanaairport.com/taxi-services/' in s, 'DEPLOYMENT STALE: documented PUJ access / LRM taxi references missing'
          assert 'https://aeropuertocibao.com.do/en/' in s and 'https://www.romanaairport.com/' in s, 'DEPLOYMENT STALE: two airport operator sources missing'
          assert 'https://www.aduanas.gob.do/manual-del-viajero/' in s and 'https://eticket.migracion.gob.do/' in s, 'DEPLOYMENT STALE: official travel resources missing'
          assert 'href="/ht/"' in s and '"@type":"WebSite"' in s, 'DEPLOYMENT STALE: new multilingual SEO pages not published'
          assert 'commons.wikimedia.org/wiki/Special:FilePath/AAirlines.png' in s, 'Canonical American Airlines logo asset missing'
          assert 'airline-logo-frame' in s and 'id="airlinesCredits"' in s, 'DEPLOYMENT STALE: credits or logo layout missing'
          assert 'logoFrame.classList.add(\'is-fallback\')' in s and '.airline-logo-frame.is-fallback' in s, 'DEPLOYMENT STALE: hardened logo fallback missing'
          assert 'img.referrerPolicy=\'no-referrer\'' in s, 'DEPLOYMENT STALE: privacy-conscious logo loading missing'
          assert 'id="flight-help"' in s and 'function renderFlightFAQ()' in s, 'DEPLOYMENT STALE: passenger FAQ missing'
          assert 'id="boardStatusLink"' in s, 'DEPLOYMENT STALE: board status link absent'
          assert 'appendDemoRouteFlag(td,v.route)' in s and 'const demoCityCountry=' in s, 'DEPLOYMENT STALE: country flags missing'
          assert 'id="boardAirportShortcuts"' in s and "url.searchParams.set('country'" in s, 'DEPLOYMENT STALE: airport shortcuts and share filters missing'
          assert 'id="statusAirlineSuggestion"' in s and 'statusAirlineHint' in s, 'DEPLOYMENT STALE: airline status source missing'
          assert 'const statusSourceWords=' in s and 'id="statusAirportOfficialLink"' in s, 'DEPLOYMENT STALE: official airport source guidance missing'
          assert 'id="flightAirlineShortcutButtons"' in s and 'board-route-country' in s and "clear.id='boardEmptyReset'" in s, 'DEPLOYMENT STALE: route labels / airline chips / recovery missing'
          assert '.airline-code{color:#344f63' in s, 'DEPLOYMENT STALE: airline code contrast fix missing'
          assert 'id="boardScrollHint"' in s and 'const boardScrollHintWords=' in s and 'scope="col"' in s, 'DEPLOYMENT STALE: accessible horizontal board missing'
          assert 'id="boardTableCaption"' in s and 'const boardTableCaptionWords=' in s, 'DEPLOYMENT STALE: accessible board caption missing'
          assert 'id="mobileBottomNav"' in s and 'function updateMobileNavigation()' in s, 'DEPLOYMENT STALE: mobile quick navigation missing'
          assert 'function normalizeSearchText(value)' in s and "e.key==='Escape'" in s, 'DEPLOYMENT STALE: accessible accent-free search missing'
          assert "reset.id='airlineEmptyReset'" in s, 'DEPLOYMENT STALE: airline search recovery missing'
          assert 'id="boardSort"' in s and 'function refreshBoardSortOptions()' in s and "url.searchParams.set('sort'" in s, 'DEPLOYMENT STALE: sorting missing'
          assert 'function updateMobileActiveSection()' in s and 'function updateSelectedAirlineChip()' in s, 'DEPLOYMENT STALE: active navigation and matched airline missing'
          assert 'id="boardActiveFilters"' in s and 'function renderActiveBoardFilters()' in s, 'DEPLOYMENT STALE: accessible filter chips missing'
          assert 'id="boardStatusFilter"' in s and "url.searchParams.set('status'" in s, 'DEPLOYMENT STALE: demo status filtering missing'
          assert 'function normalizeFlightInput(value)' in s, 'DEPLOYMENT STALE: flight input normalization missing'
          assert 'completamente ficticios' in s, 'Airport demo warning absent'
          assert 'flightradar24.com' in s.lower(), 'External data link missing'
          assert 'no publica datos de vuelo en tiempo real' in s, 'Required transparency notice absent'
          HTMLParser().feed(s)
          print('Live endpoint reachable and expected content present.')
          PY
            then
              echo "Verified current Cloudflare deployment (attempt $attempt)"
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Current Cloudflare deployment not available after 12 attempts"
              exit 1
            fi
            echo "Previous deployment still served; retrying..."
            sleep 8
          done
          curl --fail --location --silent --show-error --max-time 15 "https://vuelosrd.pages.dev/robots.txt" | grep -q 'User-agent'
      - name: Verify 40 canonical URLs and all 35 airport pages on Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          base="https://vuelosrd.pages.dev"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 20 "$base/sitemap.xml" -o /tmp/vuelosrd-sitemap.xml
          for lang in en de fr ht; do
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 20 "$base/$lang/" -o "/tmp/vuelosrd-$lang.html"
          done
          for code in puj sdq sti pop lrm azs jbq; do
            for lang in es en de fr ht; do
              if [[ "$lang" == es ]]; then url="$base/airports/$code/"; else url="$base/$lang/airports/$code/"; fi
              curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 20 "$url" -o "/tmp/vuelosrd-airport-$code-$lang.html"
            done
          done
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from xml.etree import ElementTree as ET
          import json,re
          base='https://vuelosrd.pages.dev/'
          langs=('es','en','de','fr','ht')
          codes=('puj','sdq','sti','pop','lrm','azs','jbq')
          uri=lambda lang,code=None: base+('' if lang=='es' else lang+'/')+('airports/'+code+'/' if code else '')
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root=ET.fromstring(Path('/tmp/vuelosrd-sitemap.xml').read_bytes())
          urls=[e.text for e in root.findall('.//s:loc',ns)]
          expected=[uri(lang) for lang in langs]+[uri(lang,code) for code in codes for lang in langs]
          assert len(urls)==40 and set(urls)==set(expected),f'Cloudflare sitemap URLs wrong: {len(urls)}'
          for lang in ('en','de','fr','ht'):
              html=Path(f'/tmp/vuelosrd-{lang}.html').read_text(encoding='utf-8')
              HTMLParser().feed(html)
              assert '<html lang="'+lang+'">' in html, 'Wrong hub language '+lang
              assert '<link rel="canonical" href="'+uri(lang)+'">' in html,'Hub canonical absent: '+lang
              assert 'class="hub-shortcuts"' in html, 'DEPLOYMENT STALE: localized hub shortcuts missing '+lang
              for target in ('journey-wizard','airlines','passenger-help-title'):
                  assert 'href="/?lang='+lang+'#'+target+'"' in html,'Hub quick navigation broken: '+lang+' '+target
              for code in codes:
                  assert 'href="/'+lang+'/airports/'+code+'/"' in html,'Hub guide link missing: '+lang+' '+code
          for code in codes:
              for lang in langs:
                  html=Path(f'/tmp/vuelosrd-airport-{code}-{lang}.html').read_text(encoding='utf-8')
                  HTMLParser().feed(html)
                  url=uri(lang,code)
                  assert '<html lang="'+lang+'">' in html, 'Wrong guide language '+url
                  assert 'id="quick-travel"' in html and 'class="quick-flight-form"' in html, 'Quick flight search missing '+url
                  assert 'name="lang" value="'+lang+'"' in html and 'name="airport" value="'+code.upper()+'"' in html, 'Flight form misses locale/airport '+url
                  assert 'href="#airport-sources"' in html and 'id="airport-sources"' in html, 'Official airport source shortcut broken '+url
                  assert '<link rel="canonical" href="'+url+'">' in html, 'Guide canonical '+url
                  match=re.search(r'<script type="application/ld\+json">([^<]+)</script>',html)
                  assert match and json.loads(match.group(1))['about']['iataCode']==code.upper(),'Airport schema invalid: '+url
                  assert 'class="source missing"' in html or code in ('puj','sti','lrm'),'Missing-source disclosure: '+url
                  for alternate in langs:
                      assert 'hreflang="'+alternate+'" href="'+uri(alternate,code)+'"' in html,'Guide backlink: '+lang+' '+code+' '+alternate
          print('Cloudflare SEO PASS: 40 sitemap URLs, 35 airport HTML pages, canonical, schema, local links and five-language reciprocity.')
          PY
