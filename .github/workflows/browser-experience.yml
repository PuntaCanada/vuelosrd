name: VuelosRD browser experience
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser automation package (system Chrome)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0 axe-core@4.10.3
          google-chrome --version
      - name: Start the PR checkout locally
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          curl --fail --silent --retry 5 --retry-connrefused http://127.0.0.1:8765/ -o /dev/null
      - name: Wait for Cloudflare Pages deployment
        if: github.event_name != 'pull_request'
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error --max-time 15 https://vuelosrd.pages.dev/ -o /tmp/vuelosrd-public.html &&
               cmp -s index.html /tmp/vuelosrd-public.html; then
              exit 0
            fi
            sleep 8
          done
          echo "Cloudflare Pages has not served the expected index.html"
          exit 1
      - name: Chromium browser checks (images, search and mobile)
        env:
          VUELOSRD_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:8765/' || 'https://vuelosrd.pages.dev/' }}
        run: node tests/browser-check.cjs
      - name: Upload screenshots for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vuelosrd-browser-screenshots
          path: airlines-*.png
          if-no-files-found: ignore
          retention-days: 3
