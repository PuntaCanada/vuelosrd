name: VuelosRD browser experience
on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - tests/browser-check.cjs
      - .github/workflows/browser-experience.yml
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser automation package (system Chrome)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          google-chrome --version
      - name: Wait for Cloudflare Pages deployment
        run: |
          python3 - <<'PY'
          import time,urllib.request,re,pathlib
          expected=re.findall(r"logo:'([^']+)'",pathlib.Path('index.html').read_text(encoding='utf-8'))
          assert len(expected)==4, 'Expected four sourced airline logos'
          url='https://vuelosrd.pages.dev/'
          for attempt in range(12):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'VuelosRD-browser-test'})
                  text=urllib.request.urlopen(req,timeout=18).read().decode('utf-8','replace')
                  if "statusTrackLink').setAttribute('aria-disabled'" in text and 'airline-logo-frame.is-fallback' in text and all(logo in text for logo in expected) and 'appendDemoRouteFlag(td,v.route)' in text and 'const boardEnhancementWords=' in text and 'id="boardCountry"' in text:
                      print('Current deploy detected on attempt',attempt+1)
                      break
              except Exception as e:
                  print('HTTP not ready:',repr(e))
              if attempt==11:
                  raise RuntimeError('Current Cloudflare deployment was not detected in 12 attempts')
              print('Deployment pending; retrying...')
              time.sleep(12)
          PY
      - name: Confirm published country flag assets
        run: |
          for code in de us es ca do; do
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2 "https://vuelosrd.pages.dev/assets/flags/$code.svg" | grep -q '<svg'
            echo "Verified $code.svg"
          done
      - name: Chromium browser checks (images, search and mobile)
        run: node tests/browser-check.cjs
      - name: Upload screenshots for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vuelosrd-browser-screenshots
          path: airlines-*.png
          if-no-files-found: ignore
          retention-days: 3
