name: Check VuelosRD pilot
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML markup and inline JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          class Parser(HTMLParser):
              def error(self, message): raise ValueError(message)
          Parser().feed(html)
          assert '<html lang="es">' in html
          for code in ('es','en','de','fr','ht'):
              assert re.search(r'\b'+code+r':\{', html), f'Missing language {code}'
          for code in ('PUJ','SDQ','STI','POP','LRM','AZS','JBQ'):
              assert "'"+code+"'" in html, f'Missing airport {code}'
          assert 'no publica datos de vuelo en tiempo real' in html
          assert "localStorage" in html
          assert html.count('class="flag-icon"') == 5, 'Five inline SVG flags required'
          assert 'id="langMenu"' in html and 'data-choose-lang="ht"' in html, 'Accessible language menu missing'
          assert 'id="goAirports"' in html and 'id="goTools"' in html, 'Top navigation missing'
          assert 'id="flight-board"' in html and 'id="boardRows"' in html, 'Airport demo board missing'
          assert 'const boardWords=' in html and 'function renderBoard()' in html, 'Multilingual board implementation missing'
          assert 'completamente ficticios' in html and 'DEMO ' in html, 'Demo disclosure missing'
          assert 'id="shareBoard"' in html and 'function boardUrl()' in html, 'Shareable board missing'
          assert 'id="flight-status"' in html and 'function renderFlightStatus()' in html, 'Flight detail panel missing'
          assert html.index('id="flight-board"') < html.index('id="flightTitle"'), 'Flight board must precede search'
          assert 'Airport-terminal visual system' in html and 'margin-top:-83px' in html, 'New cohesive terminal design missing'
          assert 'Compact airport display for narrow screens' in html, 'Mobile board layout missing'
          assert 'id="detail-board-link"' in html and 'id="detail-depart-link"' in html, 'Airport detail board links missing'
          assert 'const airportDetailWords=' in html and 'function airportDeepLink(' in html, 'Multilingual airport guidance missing'
          assert 'airport-card-info' in html, 'Airport card detail link missing'
          assert 'const airportArea=' in html and 'airport-card-visual' in html, 'Airport cards design missing'
          assert 'Mobile and visual polish' in html and 'class="skip-link"' in html, 'Responsive accessibility styling missing'
          assert 'id="boardLiveLink"' in html and 'id="boardAirportOfficialLink"' in html, 'Real flight source links missing'
          assert 'id="flightSearchPreview"' in html and 'function updateFlightSearch()' in html, 'Guided flight search missing'
          assert 'id="airlines"' in html and 'const airlineDirectory=' in html, 'Airline directory missing'
          assert 'id="airlineFilter"' in html and 'const airlineFilterWords=' in html, 'Multilingual airline filtering missing'
          assert html.count("logo:'https://commons.wikimedia.org/wiki/Special:FilePath/") == 4, 'Four sourced airline logos required'
          assert 'commons.wikimedia.org/wiki/Special:FilePath/AAirlines.png' in html, 'Canonical American Airlines logo asset missing'
          assert 'className=\'airline-logo-frame airline-logo-\'' in html and 'img.addEventListener(\'error\'' in html, 'Logo image or fallback missing'
          assert 'const airlineLogoWords=' in html and 'id="airlinesCredits"' in html, 'Trademark/source notice missing'
          assert 'img.addEventListener(\'load\'' in html and 'img.addEventListener(\'error\'' in html, 'Logo loading and error handlers required'
          assert 'logoFrame.classList.add(\'is-fallback\')' in html and '.airline-logo-frame.is-fallback' in html, 'Visible logo fallback missing'
          assert '.airline-card:hover' in html and '@media(max-width:480px)' in html, 'Responsive airline polish missing'
          assert "{code:'AC',name:'Air Canada',url:" in html and 'Air Canada requires prior authorization' in html, 'Air Canada permission safeguard missing'
          assert 'id="flight-help"' in html and 'const flightFAQ=' in html, 'Multilingual passenger FAQ missing'
          assert 'function renderFlightFAQ()' in html, 'FAQ rendering missing'
          assert 'id="airlineMatch"' in html and 'function updateAirlineSuggestion()' in html, 'Airline hint not connected to search'
          assert 'function isFlightNumber(value)' in html and 'airline-start-search' in html, 'Strict flight number validation or direct airline search missing'
          assert html.count('class="flag-icon"') == 5, 'Keep all language flags'
          assert 'const flightSearchMessages=' in html and 'id="clearFlight"' in html, 'Flight search languages or reset missing'
          assert 'const realSourceText=' in html, 'Real flight sources translation missing'
          assert 'skipLinkText[current]' in html, 'Translated keyboard skip link missing'
          assert 'className=\'airport-card-board\'' in html, 'Airport cards board navigation missing'
          assert 'td.dataset.label=' in html and 'PUJ · Punta Cana' in html, 'Mobile cell labels or full airport names absent'
          assert 'id="boardStatusLink"' in html, 'Flight board must link to status detail'
          assert 'const demoCityCountry=' in html and 'appendDemoRouteFlag(td,v.route)' in html, 'City country flag mapping missing'
          assert 'boardCountryNames=' in html, 'Localized country labels missing'
          assert 'id="boardAirportShortcuts"' in html and 'function renderBoardAirportShortcuts()' in html, 'Airport shortcut navigation missing'
          assert 'id="statusAirlineSuggestion"' in html and 'statusAirlineHint' in html, 'Qualified official airline status source missing'
          assert 'const statusSourceWords=' in html and 'id="statusAirportOfficialLink"' in html, 'Official airport source guidance missing'
          assert 'id="flightAirlineShortcutButtons"' in html and 'renderFlightAirlineShortcuts()' in html, 'Airline search chips missing'
          assert 'board-route-country' in html and "clear.id='boardEmptyReset'" in html, 'Board city subtitles or empty reset missing'
          assert 'id="boardTableCaption"' in html and 'const boardTableCaptionWords=' in html, 'Accessible translated board caption missing'
          assert 'id="mobileBottomNav"' in html and 'function updateMobileNavigation()' in html, 'Mobile quick navigation missing'
          assert 'function updateMobileActiveSection()' in html and 'function updateSelectedAirlineChip()' in html, 'Active mobile/airline indicator missing'
          assert 'id="boardActiveFilters"' in html and 'function renderActiveBoardFilters()' in html and "event.key==='ArrowRight'" in html, 'Filter chips or keyboard airport navigation missing'
          assert 'id="boardStatusFilter"' in html and 'const boardStatusFilterWords=' in html, 'Localized demo status filter missing'
          assert 'function normalizeFlightInput(value)' in html and 'normalizeFlightInput(originalLink.searchParams' in html, 'Hyphenated flight normalization missing'
          assert "url.searchParams.set('status'" in html and 'refreshBoardStatusOptions()' in html, 'Status filter must be shareable'
          assert "url.searchParams.set('country'" in html and "url.searchParams.set('filter'" in html, 'Sharable board filters missing'
          assert 'const flightStatusWords=' in html and 'statusPosition' in html, 'Flight status translations or missing-data indicators absent'
          assert "url.searchParams.set('view',boardMode)" in html, 'Share link must retain arrivals/departures'
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          assert len(scripts) == 1
          Path('/tmp/vuelosrd-inline.js').write_text(scripts[0], encoding='utf-8')
          print('HTML and content checks OK')
          PY
          node --check /tmp/vuelosrd-inline.js
      - name: Verify required static deployment files
        run: |
          test -s index.html
          test -s README.md
          test -s _headers
          test -s robots.txt
          test -s assets/flags/LICENSE
          for code in de us es ca do; do test -s "assets/flags/$code.svg"; done
