name: VuelosRD Chrome and accessibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser test dependencies
        run: npm install --no-save --no-package-lock playwright axe-core
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static site and run real Chromium browser checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          node tests/chrome-a11y.cjs
