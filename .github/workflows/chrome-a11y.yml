name: VuelosRD Chrome and accessibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit airline directory and logo source metadata (offline)
        run: node tests/airline-directory-audit.cjs
      - name: Install temporary browser test dependencies
        run: npm install --no-save --no-package-lock playwright axe-core
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static site and run real Chromium browser checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          node tests/chrome-a11y.cjs
          node tests/navigation-40.cjs
          node tests/lab-performance.cjs
      - name: Verify published Cloudflare Pages in real Chromium
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Production check attempt ${attempt}/6"
            if node tests/production-smoke.cjs; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 15; fi
          done
          echo "Cloudflare deployment could not be confirmed from GitHub Actions"
          exit 1
