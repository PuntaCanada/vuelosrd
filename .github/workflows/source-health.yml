name: Official airport source health
on:
  workflow_dispatch:
  schedule:
    - cron: '27 8 * * 1'
permissions:
  contents: read
jobs:
  source-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check official airport, customs and immigration links
        run: node tests/source-health.cjs
