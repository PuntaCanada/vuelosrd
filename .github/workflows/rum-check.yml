name: One-off production RUM check (no deployment)
on:
  pull_request:
    paths:
      - '.github/workflows/rum-check.yml'
      - 'tests/rum-check.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/rum-check.cjs
